workflows:
  android-release:
    name: FinCalc Android Release
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - google_play        # عرّف فيه KEYSTORE / KEY_PASSWORD / KEY_ALIAS في Codemagic UI
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Run unit tests
        script: flutter test
      - name: Analyze
        script: flutter analyze
      - name: Build APK
        script: flutter build apk --release
      - name: Build AAB (لو هترفع على Google Play)
        script: flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - your-email@example.com
